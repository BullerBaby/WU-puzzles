name = "wu-puzzles"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Serve the repo root as the static site.
[assets]
directory = "."
binding = "ASSETS"
# IMPORTANT: static assets are served *before* the Worker runs. With the
# "single-page-application" fallback, /api/... would be answered with
# index.html and the API would never be reached. "none" means unmatched
# paths fall through to the Worker instead, which handles /api/* and
# forwards everything else back to the asset server. (This app has no
# client-side routing, so it doesn't need the SPA fallback.)
not_found_handling = "none"

# Key-value store for highscores and saved progress.
# Create it once with:
#   npx wrangler kv namespace create SCORES
# then paste the returned id below (and keep preview_id for `wrangler dev`).
[[kv_namespaces]]
binding = "SCORES"
id = "e2aa2729d6fb4012b127cf09e4aea244"
